# Local development stack for Velora. Stands in for the managed services used in
# staging and production: Supabase Postgres, Upstash Redis and Cloudflare R2.
#
#   make infra-up      start everything, wait until healthy, and stamp the dev
#                      database as local (the dev seed writes nowhere else, D-064)
#   make infra-down    stop, keeping the data volumes
#   make infra-reset   stop and DROP the data volumes
#
# Credentials are development defaults on purpose. Real values live in the
# environment and are never committed (CLAUDE.md rule 13).
#
# Every port is published on 127.0.0.1 only (D-036): Docker's default binds to
# 0.0.0.0, which would expose this password-less Redis and the dev database to
# anyone on the same network.

name: velora

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velora}
      POSTGRES_DB: ${POSTGRES_DB:-velora}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - velora_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velora} -d ${POSTGRES_DB:-velora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - velora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # S3, standing in for R2 (D-086): SeaweedFS, since MinIO was archived and its
  # images withdrawn. Pinned by version and by the digest of its multi-arch
  # index, so a re-tag can't change what runs. Its S3 gateway answers on 9000,
  # path-style; nothing else of it is published. Credentials, and anonymous
  # read on velora-public only (it mirrors the CDN-served bucket, D-027), are
  # in ./s3/s3.json: development values, as above.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - velora_s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot: creates whichever of the two buckets is missing, then exits.
  # Inside s3's network, so its master answers on localhost; creating a bucket
  # that exists is an error in `weed shell`, hence the check first.
  s3-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    network_mode: "service:s3"
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        existing="$$(echo s3.bucket.list | weed shell -master=localhost:9333 | awk '{print $$1}')"
        for bucket in velora-public velora-private; do
          if ! printf '%s\n' "$$existing" | grep -qx "$$bucket"; then
            printf 's3.bucket.create -name %s\n' "$$bucket" | weed shell -master=localhost:9333
          fi
        done
        echo "init: buckets ready"
        echo s3.bucket.list | weed shell -master=localhost:9333

volumes:
  velora_pgdata:
  velora_redisdata:
  velora_s3data:
