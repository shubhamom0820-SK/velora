# Staging worker on Fly (T-4.4, D-095). Deployed by .github/workflows/deploy.yml
# after the API, as
#   flyctl deploy api --config "$GITHUB_WORKSPACE/infra/fly.worker.toml"
# so api/ is the build context: the API's own image, run as the ARQ worker
# (`python -m app.workers`), with the API's settings, connecting to the database
# as the same least-privilege role, velora_api. No HTTP: it only reads Redis.
# Secrets are set in Fly, never here (infra/STAGING.md §4). When P-49 moves the
# API, this app moves with it (D-095).

app = "velora-worker-staging"
primary_region = "sin"

[build]
  # Both relative to this file.
  dockerfile = "../api/Dockerfile"
  ignorefile = "../api/.dockerignore" # P-32: no .env in any layer

# Before any machine is replaced, a one-off machine with this app's settings and
# secrets checks them: a missing Sightengine key or a fake provider stops the
# deploy, with the setting's name, instead of a crash loop after it.
[deploy]
  release_command = "python -m app.workers --check"

[processes]
  worker = "python -m app.workers"

[env]
  ENV = "staging"
  # D-045: outside local, every provider is a real one. The worker calls two:
  # Sightengine and R2. The rest are named because Settings requires them, and
  # nothing here calls them.
  AUTH_PHONE_PROVIDER = "firebase"
  FIREBASE_PROJECT_ID = "velora-ic"
  SMS_PROVIDER = "msg91"
  PAYMENTS_PROVIDER = "razorpay"
  MODERATION_PROVIDER = "sightengine"
  FACEMATCH_PROVIDER = "sface"
  STORAGE_PROVIDER = "s3"
  PUSH_PROVIDER = "webpush"
  # Settings requires it outside local (D-056); the worker serves no requests.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  # D-091: a look at the queue every 10 seconds, 52% of Upstash Free idle.
  WORKER_POLL_DELAY_S = "10"
  # One process: at most 2 + 1 = 3 connections to Postgres. The budget, the
  # API's included, is in infra/STAGING.md.
  DB_POOL_SIZE = "2"
  DB_MAX_OVERFLOW = "1"
  # R2 (T-4.1), as fly.api.toml: the account and the CDN aren't secrets; the
  # token's two values are Fly secrets, the same as the API's.
  R2_ACCOUNT_ID = "82f9b26266ddb6b491a623971f87d3c7"
  R2_BUCKET_PUBLIC = "velora-staging-public"
  R2_BUCKET_PRIVATE = "velora-staging-private"
  PUBLIC_CDN_URL = "https://cdn.staging.veloraapp.co.in"

# Kept running: a worker that stops leaves every upload pending.
[[restart]]
  policy = "always"
  processes = ["worker"]

# D-088: 1 GB, not 512 MB, for T-4.5's face matching beside the app. Its size is
# locked only once the peak is measured on this machine (D-088, condition 1).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
