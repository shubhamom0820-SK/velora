# CI (T-1.20, D-044). Runs on every push, to any branch. There are no pull
# requests, so nothing is marked "required": the gate is /done, which
# fast-forwards main only when this workflow passed for that exact commit
# (scripts/ci-gate). T-1.22's deploy checks again.
#
# Minutes (P-282, D-410). On main the `vouch` job asks GitHub for a passed run
# of this exact commit on a branch, and when one exists the other jobs are
# skipped: landing is a fast-forward to a commit whose branch run the gate read,
# so main's full run repeated it for nothing. The run still completes green for
# the SHA, so the deploy fires and the gates read it as today. Nothing vouching
# means the full CI, here. And the journeys run only when a changed path is
# outside scripts/ci-e2e-needed's allowlist of what can't reach one (docs/,
# *.md, .claude/); a docs-only push skips the e2e job, which leaves the run's
# conclusion `success`, as the gates expect.
#
# Third-party actions are pinned to a commit SHA; the comment names the version.
# GitHub only triggers workflows that exist on the default branch: a new or renamed
# workflow can't run by workflow_run or by hand from its own branch (06-TESTING).
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress. The /done
# gate treats a cancelled run as not green. Never on main (P-282): a second
# landing cancelling the first's run would leave the first commit with no green
# run, so its deploy never fires. Main's runs queue instead, one pending at a
# time, which GitHub keeps as first in, first out.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.13"
  NODE_VERSION: "24"
  # The same gitleaks version as the pre-commit hook. The checksum is copied from
  # the release's checksums file into this repo, so a tampered release fails.
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  # Settings the API refuses to start without. The keys are the repo's public
  # test keys (PUBLIC_TEST_KEYS in api/app/core/config.py, which the test
  # harness uses too): not secrets, and refused anywhere ENV isn't local (D-060).
  # A test holds these four to that list. Keep them quoted: unquoted, YAML reads
  # an all-digit one as a number (run 37078451050 got 7.07070707070707E+63). The
  # test parses them with PyYAML, which isn't GitHub's parser; quoting is what
  # makes every parser agree, so keep both.
  ENV: local
  DATABASE_URL: postgresql+asyncpg://velora:velora@127.0.0.1:5432/velora_test
  REDIS_URL: redis://127.0.0.1:6379/1
  JWT_SECRET: "6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a"
  PHONE_PEPPER: "7070707070707070707070707070707070707070707070707070707070707070"
  PHONE_ENC_KEY: "6565656565656565656565656565656565656565656565656565656565656565"
  CODE_PEPPER: "6363636363636363636363636363636363636363636363636363636363636363"

jobs:
  # P-282 (D-410): on a push to main, a passed branch run of this exact commit
  # vouches for it, and the jobs below are skipped (their `if`). The script
  # answers false to anything it can't be sure of, GitHub not answering
  # included, and false runs the full CI here. Only a push: a run started by
  # hand on main is the way to run everything there. Reading runs needs
  # `actions: read`, for this job alone.
  vouch:
    name: vouch — main, a branch run already passed this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      vouched: ${{ steps.vouch.outputs.vouched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the script's own verdict counts: a crash, or anything that isn't
      # `vouched=…`, means the full CI runs.
      - name: A passed branch run for this exact commit?
        id: vouch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          verdict="$(scripts/ci-vouch "$GITHUB_SHA" "$GITHUB_REF_NAME")"
          status=$?
          set -e
          if [[ "$status" != 0 || "$verdict" != vouched=* ]]; then verdict=vouched=false; fi
          echo "$verdict" | tee -a "$GITHUB_OUTPUT"

  api:
    name: api — secrets, lint, migrate, pytest
    needs: [vouch]
    if: ${{ !cancelled() && needs.vouch.outputs.vouched != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      e2e: ${{ steps.e2e.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan reads every commit
          persist-credentials: false

      # P-282 (D-410): the journeys run only when a changed path is outside the
      # allowlist of what can't reach one. On main, the paths since the push's
      # previous tip; on a branch, everything it changed since it left main,
      # never the push's `before` (the script says why). Decided here, in a job
      # e2e needs anyway and the one with the history, so it costs no billed
      # minute of its own. Only the script's own verdict counts: a crash, or
      # anything that isn't `e2e=…`, runs the journeys.
      - name: Do the journeys need to run?
        id: e2e
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set +e
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            verdict="$(scripts/ci-e2e-needed --before "$BEFORE" HEAD)"
          else
            verdict="$(scripts/ci-e2e-needed --from-main origin/main HEAD)"
          fi
          status=$?
          set -e
          if [[ "$status" != 0 || "$verdict" != e2e=* ]]; then verdict=e2e=true; fi
          echo "$verdict" | tee -a "$GITHUB_OUTPUT"

      # The pre-commit hook only protects clones that ran `make hooks`, and
      # `git commit --no-verify` skips it. This scans the whole history (P-09).
      - name: Secrets scan (gitleaks, full history)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose "$GITHUB_WORKSPACE"

      # The same Postgres and Redis as `make infra-up`, from the same compose
      # file, so CI's test database is built exactly like yours: our init script
      # creates velora_test, and the postgis image's own script (which adds
      # topology and tiger-geocoder tables) never runs. As service containers,
      # CI built it differently and T-1.20's first run failed on that alone.
      # S3 too (SeaweedFS, D-086), with the buckets `make infra-up` makes: T-4.1's
      # storage tests run against it, and fail (never skip) here when it's down.
      - name: Start Postgres, Redis and S3 (infra/docker-compose.yml)
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait db redis s3
          docker compose -f infra/docker-compose.yml run --rm s3-init

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install
        working-directory: api
        run: uv sync --locked

      - name: Lint (ruff, format, mypy)
        run: make lint-api

      - name: Migrate the test database
        working-directory: api
        run: uv run alembic upgrade head

      # The face models (D-088, T-4.5): fetched from OpenCV Zoo and checked
      # against D-088's SHA-256s, cached under the file that records them. With
      # CI=true the real face match's tests fail, never skip, without them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api/models
          key: face-models-${{ hashFiles('api/app/core/facemodels.py') }}

      - name: Fetch the face models
        working-directory: api
        run: uv run python -m app.core.facemodels

      # CI=true (set by GitHub) turns an unreachable database into a failure,
      # never a skip (06-TESTING). The critical tests run first.
      - name: Test (pytest)
        run: make test-api

  web:
    name: web — lint, vitest, build
    needs: [vouch]
    if: ${{ !cancelled() && needs.vouch.outputs.vouched != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, tsc, prettier)
        run: make lint-web

      - name: Test (vitest)
        run: make test-web

      - name: Build (next build)
        working-directory: web
        # The legal pages may show a missing fact only where APP_ENV allows it
        # (D-053); CI builds to prove the app compiles, not to ship it.
        env:
          APP_ENV: ci
        run: pnpm build


  # T-3.13 (06-TESTING's step 4): the user journeys in Playwright, after lint,
  # unit tests and the build passed. A production build of the web against the
  # API on a P-55 slot of its own (api/tests/e2e_server.py), the worker beside
  # it and the local S3 behind it (T-4.9, D-330). Nothing is uploaded from it,
  # on purpose (decision 22): a trace records request and response bodies,
  # phone numbers, codes and access tokens among them, and a page snapshot
  # shows the phone screen. Failures speak through their assertions.
  # Only when a changed path can reach a journey (P-282, the api job's verdict);
  # skipped otherwise, which leaves the run's conclusion `success`. So a
  # required status check (P-180) must never name this job. The condition names
  # its needs' results itself: GitHub carries a skip down the whole needs chain,
  # so `vouch`, skipped on every branch, would skip this job too, however green
  # api and web are, unless the condition opts out with a status function (seen
  # on run 37684502234: e2e=true printed, the job skipped).
  e2e:
    name: e2e — Playwright
    needs: [api, web]
    if: ${{ !cancelled() && needs.api.result == 'success' && needs.web.result == 'success' && needs.api.outputs.e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Postgres, Redis and S3 (SeaweedFS, D-086) from the same compose file as
      # `make infra-up`, its buckets and the private bucket's CORS rule included
      # (s3-init): the journeys upload photos and a selfie from the browser
      # (T-4.9), and the launcher refuses to start without the S3.
      - name: Start Postgres, Redis and S3 (infra/docker-compose.yml)
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait db redis s3
          docker compose -f infra/docker-compose.yml run --rm s3-init

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          (cd api && uv sync --locked)
          (cd web && pnpm install --frozen-lockfile)

      # The face models (D-088), as the api job fetches them: J2's selfie is
      # compared by the real models on the worker (T-4.9, D-330), and the
      # launcher refuses to start without them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api/models
          key: face-models-${{ hashFiles('api/app/core/facemodels.py') }}

      - name: Fetch the face models
        working-directory: api
        run: uv run python -m app.core.facemodels

      - name: Install Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # The workflow's env says ENV=local and the test keys; the launcher sets
      # its own database and Redis from its slot, and the web builds for local.
      - name: E2E (Playwright)
        run: make e2e

  image:
    name: image — no .env inside, serves, fails fast
    needs: [vouch]
    if: ${{ !cancelled() && needs.vouch.outputs.vouched != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: velora-api:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every container below runs as staging, which refuses the repo's public
      # test keys (D-060), so this job draws throwaway ones, as staging's own are
      # drawn: the same shapes, never written anywhere.
      - name: Throwaway keys (staging refuses the repo's test keys)
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 64)"
            echo "PHONE_PEPPER=$(openssl rand -hex 32)"
            echo "PHONE_ENC_KEY=$(openssl rand -hex 32)"
            echo "CODE_PEPPER=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      # P-32: CI's checkout never has an api/.env, so the check would pass
      # without testing anything. Plant one; .dockerignore must keep it out.
      - name: Plant an api/.env the image must not contain
        run: printf 'JWT_SECRET=planted-by-ci\n' > api/.env

      - name: Build the API image (the Dockerfile Fly builds)
        run: docker build -t "$IMAGE" api

      - name: No .env in any layer
        run: |
          scripts/check-image-no-env "$IMAGE"
          if docker save "$IMAGE" | grep -a -q planted-by-ci; then
            echo "::error::The planted .env's contents are inside the image."
            exit 1
          fi

      # T-1.15, D-064: the dev seed writes fake users, with phone numbers that may
      # be real people's. api/.dockerignore keeps it out, so no bug in its guards
      # can run it in production. Finding /app/app/main.py first proves the check
      # looked inside the API image, not at some image where nothing is anywhere.
      - name: No dev seed in the image
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -f /app/app/main.py || { echo "::error::No /app/app/main.py: this is not the API image."; exit 1; }
            if test -e /app/seed; then echo "::error::/app/seed is in the image: api/.dockerignore must exclude seed."; exit 1; fi
            echo "No dev seed in the image."'

      # D-381: torch and onnxruntime, the liveness probe's tools, live only in
      # api/bench/liveness/Dockerfile. A .pth file is a pickle, which can run code
      # as it loads, so neither, nor the bench itself, ever ships. The lock and
      # the Dockerfile are held by tests/bench/liveness; this looks inside the image.
      - name: No liveness bench and no bench tools in the image
        run: scripts/check-image-no-bench-tools "$IMAGE"

      # T-9.4 (D-856): PUSH_PROVIDER=webpush needs a VAPID pair. A throwaway one,
      # made by the image itself, used by nothing, never printed: it goes to the
      # later steps' environment only.
      - name: A throwaway VAPID pair
        run: docker run --rm "$IMAGE" python -m app.core.vapid >> "$GITHUB_ENV"

      - name: Serves /healthz, hides its schema outside local
        run: |
          # Outside local, Redis must be rediss:// (TLS); it's never reached here.
          # Staging as fly.api.toml sets it, CLIENT_IP_HEADER included (D-056), and
          # R2 with a placeholder token, never used: nothing touches storage here.
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e ENV=staging -e DATABASE_URL -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER -e CLIENT_IP_HEADER=Fly-Client-IP \
            -e AUTH_PHONE_PROVIDER=firebase -e FIREBASE_PROJECT_ID=velora-ic \
            -e SMS_PROVIDER=msg91 -e PAYMENTS_PROVIDER=razorpay \
            -e MODERATION_PROVIDER=sightengine -e FACEMATCH_PROVIDER=sface \
            -e STORAGE_PROVIDER=s3 -e PUSH_PROVIDER=webpush \
            -e VAPID_PRIVATE_KEY -e VAPID_PUBLIC_KEY -e VAPID_SUBJECT=https://veloraapp.co.in/contact \
            -e R2_ACCOUNT_ID=82f9b26266ddb6b491a623971f87d3c7 -e R2_ACCESS_KEY_ID=ci \
            -e R2_SECRET_ACCESS_KEY=ci -e R2_BUCKET_PUBLIC=velora-staging-public \
            -e R2_BUCKET_PRIVATE=velora-staging-private \
            -e PUBLIC_CDN_URL=https://cdn.staging.veloraapp.co.in "$IMAGE"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/healthz && break; sleep 1; done
          # A container that never answers says why in its own log. Print it: without
          # it the only clue is "/healthz never answered", and finding out costs a
          # reproduction (T-2.3's first CI run).
          if ! curl -sf -o /dev/null http://127.0.0.1:8000/healthz; then
            echo "::error::The container never answered /healthz. Its log:"
            docker logs api 2>&1 | tail -n 40
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)" = 200
          body="$(curl -s -w '\n%{http_code}' http://127.0.0.1:8000/openapi.json)"
          echo "$body"
          test "$(tail -n 1 <<<"$body")" = 404
          grep -q '"code":"NOT_FOUND"' <<<"$body"
          if grep -q '"paths"' <<<"$body"; then echo "::error::The 404 carries the schema."; exit 1; fi
          test "$(docker exec api id -u)" != 0

      # uvicorn restarts dying workers, so a config error must stop the container
      # before any start, not crash-loop inside it (D-045's refusal is one).
      - name: A configuration error stops the container
        run: |
          set +e
          output="$(timeout 60 docker run --rm -e ENV=staging -e DATABASE_URL -e REDIS_URL \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER "$IMAGE" 2>&1)"
          status=$?
          set -e
          echo "$output" | tail -n 5
          test "$status" = 1
          grep -q 'ENV=staging cannot use fake providers' <<<"$output"

      # D-056's refusal, proved in the image that actually runs, not only in the
      # tests: everything staging needs except CLIENT_IP_HEADER. Without it, per-IP
      # limits would key on an address the client chooses.
      - name: Staging without CLIENT_IP_HEADER refuses to start
        run: |
          set +e
          output="$(timeout 60 docker run --rm -e ENV=staging -e DATABASE_URL \
            -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER \
            -e AUTH_PHONE_PROVIDER=firebase -e FIREBASE_PROJECT_ID=velora-ic \
            -e SMS_PROVIDER=msg91 -e PAYMENTS_PROVIDER=razorpay \
            -e MODERATION_PROVIDER=sightengine -e FACEMATCH_PROVIDER=sface \
            -e STORAGE_PROVIDER=s3 -e PUSH_PROVIDER=webpush \
            -e VAPID_PRIVATE_KEY -e VAPID_PUBLIC_KEY -e VAPID_SUBJECT=https://veloraapp.co.in/contact \
            -e R2_ACCOUNT_ID=82f9b26266ddb6b491a623971f87d3c7 -e R2_ACCESS_KEY_ID=ci \
            -e R2_SECRET_ACCESS_KEY=ci -e R2_BUCKET_PUBLIC=velora-staging-public \
            -e R2_BUCKET_PRIVATE=velora-staging-private \
            -e PUBLIC_CDN_URL=https://cdn.staging.veloraapp.co.in "$IMAGE" 2>&1)"
          status=$?
          set -e
          echo "$output" | tail -n 5
          test "$status" = 1
          grep -q 'ENV=staging needs CLIENT_IP_HEADER' <<<"$output"

      # T-2.6: production's settings, read from its own Fly config rather than
      # copied here by hand, so a setting production lacks fails here, before a
      # release, instead of in Fly's logs on release day. Throwaway keys, as above.
      - name: Starts as production, with fly.api.production.toml's settings
        run: |
          python3 - > production.env <<'PY'
          import tomllib
          with open("infra/fly.api.production.toml", "rb") as f:
              for key, value in tomllib.load(f)["env"].items():
                  print(f"{key}={value}")
          PY
          grep -qx 'ENV=production' production.env
          # R2's token is a Fly secret (infra/PRODUCTION.md §4): a placeholder here.
          docker run -d --name api-production -p 127.0.0.1:8001:8000 --env-file production.env \
            -e DATABASE_URL -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci -e VAPID_PRIVATE_KEY -e VAPID_PUBLIC_KEY \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER "$IMAGE"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/healthz && break; sleep 1; done
          if ! curl -sf -o /dev/null http://127.0.0.1:8001/healthz; then
            echo "::error::The image never answered /healthz as production. Its log:"
            docker logs api-production 2>&1 | tail -n 40
            exit 1
          fi
          body="$(curl -s -w '\n%{http_code}' http://127.0.0.1:8001/openapi.json)"
          test "$(tail -n 1 <<<"$body")" = 404
          if grep -q '"paths"' <<<"$body"; then echo "::error::The 404 carries the schema."; exit 1; fi

      # T-4.4: the worker's settings, read from its own Fly config, in the image
      # that runs it. With Sightengine's keys (placeholders) it is ready; without
      # them it refuses, naming both, as Fly's release command would before a
      # deploy. Nothing here connects: --check only reads the settings.
      - name: The worker's settings from fly.worker.toml, ready and refused
        run: |
          python3 - > worker.env <<'PY'
          import tomllib
          with open("infra/fly.worker.toml", "rb") as f:
              for key, value in tomllib.load(f)["env"].items():
                  print(f"{key}={value}")
          PY
          grep -qx 'ENV=staging' worker.env
          check() {
            docker run --rm --env-file worker.env \
              -e DATABASE_URL -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
              -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci -e VAPID_PRIVATE_KEY -e VAPID_PUBLIC_KEY \
              -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER \
              "$@" "$IMAGE" python -m app.workers --check 2>&1
          }
          set +e
          ready="$(check -e SIGHTENGINE_API_USER=ci -e SIGHTENGINE_API_SECRET=ci)"
          ready_status=$?
          refused="$(check)"
          refused_status=$?
          set -e
          echo "$ready"
          echo "$refused"
          test "$ready_status" = 0
          grep -qx 'worker: settings ready.' <<<"$ready"
          test "$refused_status" = 2
          grep -q 'MODERATION_PROVIDER=sightengine needs SIGHTENGINE_API_USER, SIGHTENGINE_API_SECRET' <<<"$refused"

  repo:
    name: repo — types, hooks, gate
    needs: [vouch]
    if: ${{ !cancelled() && needs.vouch.outputs.vouched != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          (cd api && uv sync --locked)
          (cd web && pnpm install --frozen-lockfile)

      # Rule 10: a response schema can't change with stale web types.
      - name: Types are fresh
        run: |
          make types
          if ! git diff --exit-code -- web/src/types/api.ts; then
            echo "::error file=web/src/types/api.ts::Stale types: run 'make types' and commit the result (CLAUDE.md rule 10)."
            exit 1
          fi

      # `git commit --no-verify` skips every hook, and `make lint` doesn't run the
      # colour-token hook at all, so CI runs them all. gitleaks' hook only scans
      # staged changes; the api job scans the whole history instead.
      - name: pre-commit hooks, every file
        env:
          SKIP: gitleaks
        run: uv run --project api pre-commit run --all-files --show-diff-on-failure

      - name: The /done gate's own tests
        run: scripts/ci-gate-test

      - name: The release gate's own tests (D-075)
        run: scripts/release-gate-test

      - name: The vouch's and the journeys' gate's own tests (P-282)
        run: |
          scripts/ci-vouch-test
          scripts/ci-e2e-needed-test

      # P-49, D-1021: our Caddyfile, in the pinned Caddy image, never hands the
      # API a client-written Caddy-Client-IP; the test runs the check on it and
      # shows it fails on two weakened copies. Needs Docker, which runners have.
      - name: Caddy sets the client's address itself (D-1021)
        run: scripts/check-caddy-client-ip-test

      # P-49: the secrets script's own loop, storage stubbed (no gcloud here).
      - name: The secrets script's own tests
        run: scripts/gcp-secrets-test
