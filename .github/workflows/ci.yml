# CI (T-1.20, D-044). Runs on every push, to any branch. There are no pull
# requests, so nothing is marked "required": the gate is /done, which
# fast-forwards main only when this workflow passed for that exact commit
# (scripts/ci-gate). T-1.22's deploy checks again.
#
# Third-party actions are pinned to a commit SHA; the comment names the version.
# GitHub only triggers workflows that exist on the default branch: a new or renamed
# workflow can't run by workflow_run or by hand from its own branch (06-TESTING).
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress. The /done
# gate treats a cancelled run as not green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.13"
  NODE_VERSION: "24"
  # The same gitleaks version as the pre-commit hook. The checksum is copied from
  # the release's checksums file into this repo, so a tampered release fails.
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  # Settings the API refuses to start without. The keys are the repo's public
  # test keys (PUBLIC_TEST_KEYS in api/app/core/config.py, which the test
  # harness uses too): not secrets, and refused anywhere ENV isn't local (D-060).
  # A test holds these four to that list. Keep them quoted: unquoted, YAML reads
  # an all-digit one as a number (run 37078451050 got 7.07070707070707E+63). The
  # test parses them with PyYAML, which isn't GitHub's parser; quoting is what
  # makes every parser agree, so keep both.
  ENV: local
  DATABASE_URL: postgresql+asyncpg://velora:velora@127.0.0.1:5432/velora_test
  REDIS_URL: redis://127.0.0.1:6379/1
  JWT_SECRET: "6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a"
  PHONE_PEPPER: "7070707070707070707070707070707070707070707070707070707070707070"
  PHONE_ENC_KEY: "6565656565656565656565656565656565656565656565656565656565656565"
  CODE_PEPPER: "6363636363636363636363636363636363636363636363636363636363636363"

jobs:
  api:
    name: api — secrets, lint, migrate, pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan reads every commit
          persist-credentials: false

      # The pre-commit hook only protects clones that ran `make hooks`, and
      # `git commit --no-verify` skips it. This scans the whole history (P-09).
      - name: Secrets scan (gitleaks, full history)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose "$GITHUB_WORKSPACE"

      # The same Postgres and Redis as `make infra-up`, from the same compose
      # file, so CI's test database is built exactly like yours: our init script
      # creates velora_test, and the postgis image's own script (which adds
      # topology and tiger-geocoder tables) never runs. As service containers,
      # CI built it differently and T-1.20's first run failed on that alone.
      # MinIO isn't started: no test uses storage yet.
      - name: Start Postgres and Redis (infra/docker-compose.yml)
        run: docker compose -f infra/docker-compose.yml up -d --wait db redis

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install
        working-directory: api
        run: uv sync --locked

      - name: Lint (ruff, format, mypy)
        run: make lint-api

      - name: Migrate the test database
        working-directory: api
        run: uv run alembic upgrade head

      # CI=true (set by GitHub) turns an unreachable database into a failure,
      # never a skip (06-TESTING). The critical tests run first.
      - name: Test (pytest)
        run: make test-api

  web:
    name: web — lint, vitest, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, tsc, prettier)
        run: make lint-web

      - name: Test (vitest)
        run: make test-web

      - name: Build (next build)
        working-directory: web
        # The legal pages may show a missing fact only where APP_ENV allows it
        # (D-053); CI builds to prove the app compiles, not to ship it.
        env:
          APP_ENV: ci
        run: pnpm build


  # T-3.13 (06-TESTING's step 4): the user journeys in Playwright, after lint,
  # unit tests and the build passed. A production build of the web against the
  # API on a P-55 slot of its own (api/tests/e2e_server.py). Nothing is uploaded
  # from it, on purpose (decision 22): a trace records request and response
  # bodies, phone numbers, codes and access tokens among them, and a page
  # snapshot shows the phone screen. Failures speak through their assertions.
  e2e:
    name: e2e — Playwright
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Postgres and Redis (infra/docker-compose.yml)
        run: docker compose -f infra/docker-compose.yml up -d --wait db redis

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          (cd api && uv sync --locked)
          (cd web && pnpm install --frozen-lockfile)

      - name: Install Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # The workflow's env says ENV=local and the test keys; the launcher sets
      # its own database and Redis from its slot, and the web builds for local.
      - name: E2E (Playwright)
        run: make e2e

  image:
    name: image — no .env inside, serves, fails fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: velora-api:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every container below runs as staging, which refuses the repo's public
      # test keys (D-060), so this job draws throwaway ones, as staging's own are
      # drawn: the same shapes, never written anywhere.
      - name: Throwaway keys (staging refuses the repo's test keys)
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 64)"
            echo "PHONE_PEPPER=$(openssl rand -hex 32)"
            echo "PHONE_ENC_KEY=$(openssl rand -hex 32)"
            echo "CODE_PEPPER=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      # P-32: CI's checkout never has an api/.env, so the check would pass
      # without testing anything. Plant one; .dockerignore must keep it out.
      - name: Plant an api/.env the image must not contain
        run: printf 'JWT_SECRET=planted-by-ci\n' > api/.env

      - name: Build the API image (the Dockerfile Fly builds)
        run: docker build -t "$IMAGE" api

      - name: No .env in any layer
        run: |
          scripts/check-image-no-env "$IMAGE"
          if docker save "$IMAGE" | grep -a -q planted-by-ci; then
            echo "::error::The planted .env's contents are inside the image."
            exit 1
          fi

      # T-1.15, D-064: the dev seed writes fake users, with phone numbers that may
      # be real people's. api/.dockerignore keeps it out, so no bug in its guards
      # can run it in production. Finding /app/app/main.py first proves the check
      # looked inside the API image, not at some image where nothing is anywhere.
      - name: No dev seed in the image
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -f /app/app/main.py || { echo "::error::No /app/app/main.py: this is not the API image."; exit 1; }
            if test -e /app/seed; then echo "::error::/app/seed is in the image: api/.dockerignore must exclude seed."; exit 1; fi
            echo "No dev seed in the image."'

      - name: Serves /healthz, hides its schema outside local
        run: |
          # Outside local, Redis must be rediss:// (TLS); it's never reached here.
          # Staging as fly.api.toml sets it, CLIENT_IP_HEADER included (D-056).
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e ENV=staging -e DATABASE_URL -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER -e CLIENT_IP_HEADER=Fly-Client-IP \
            -e AUTH_PHONE_PROVIDER=firebase -e FIREBASE_PROJECT_ID=velora-ic \
            -e SMS_PROVIDER=msg91 -e PAYMENTS_PROVIDER=razorpay \
            -e MODERATION_PROVIDER=sightengine -e FACEMATCH_PROVIDER=rekognition \
            -e STORAGE_PROVIDER=s3 -e PUSH_PROVIDER=webpush "$IMAGE"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/healthz && break; sleep 1; done
          # A container that never answers says why in its own log. Print it: without
          # it the only clue is "/healthz never answered", and finding out costs a
          # reproduction (T-2.3's first CI run).
          if ! curl -sf -o /dev/null http://127.0.0.1:8000/healthz; then
            echo "::error::The container never answered /healthz. Its log:"
            docker logs api 2>&1 | tail -n 40
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)" = 200
          body="$(curl -s -w '\n%{http_code}' http://127.0.0.1:8000/openapi.json)"
          echo "$body"
          test "$(tail -n 1 <<<"$body")" = 404
          grep -q '"code":"NOT_FOUND"' <<<"$body"
          if grep -q '"paths"' <<<"$body"; then echo "::error::The 404 carries the schema."; exit 1; fi
          test "$(docker exec api id -u)" != 0

      # uvicorn restarts dying workers, so a config error must stop the container
      # before any start, not crash-loop inside it (D-045's refusal is one).
      - name: A configuration error stops the container
        run: |
          set +e
          output="$(timeout 60 docker run --rm -e ENV=staging -e DATABASE_URL -e REDIS_URL \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER "$IMAGE" 2>&1)"
          status=$?
          set -e
          echo "$output" | tail -n 5
          test "$status" = 1
          grep -q 'ENV=staging cannot use fake providers' <<<"$output"

      # D-056's refusal, proved in the image that actually runs, not only in the
      # tests: everything staging needs except CLIENT_IP_HEADER. Without it, per-IP
      # limits would key on an address the client chooses.
      - name: Staging without CLIENT_IP_HEADER refuses to start
        run: |
          set +e
          output="$(timeout 60 docker run --rm -e ENV=staging -e DATABASE_URL \
            -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER \
            -e AUTH_PHONE_PROVIDER=firebase -e FIREBASE_PROJECT_ID=velora-ic \
            -e SMS_PROVIDER=msg91 -e PAYMENTS_PROVIDER=razorpay \
            -e MODERATION_PROVIDER=sightengine -e FACEMATCH_PROVIDER=rekognition \
            -e STORAGE_PROVIDER=s3 -e PUSH_PROVIDER=webpush "$IMAGE" 2>&1)"
          status=$?
          set -e
          echo "$output" | tail -n 5
          test "$status" = 1
          grep -q 'ENV=staging needs CLIENT_IP_HEADER' <<<"$output"

      # T-2.6: production's settings, read from its own Fly config rather than
      # copied here by hand, so a setting production lacks fails here, before a
      # release, instead of in Fly's logs on release day. Throwaway keys, as above.
      - name: Starts as production, with fly.api.production.toml's settings
        run: |
          python3 - > production.env <<'PY'
          import tomllib
          with open("infra/fly.api.production.toml", "rb") as f:
              for key, value in tomllib.load(f)["env"].items():
                  print(f"{key}={value}")
          PY
          grep -qx 'ENV=production' production.env
          docker run -d --name api-production -p 127.0.0.1:8001:8000 --env-file production.env \
            -e DATABASE_URL -e REDIS_URL=rediss://ci:ci@127.0.0.1:6379/1 \
            -e JWT_SECRET -e PHONE_PEPPER -e PHONE_ENC_KEY -e CODE_PEPPER "$IMAGE"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8001/healthz && break; sleep 1; done
          if ! curl -sf -o /dev/null http://127.0.0.1:8001/healthz; then
            echo "::error::The image never answered /healthz as production. Its log:"
            docker logs api-production 2>&1 | tail -n 40
            exit 1
          fi
          body="$(curl -s -w '\n%{http_code}' http://127.0.0.1:8001/openapi.json)"
          test "$(tail -n 1 <<<"$body")" = 404
          if grep -q '"paths"' <<<"$body"; then echo "::error::The 404 carries the schema."; exit 1; fi

  repo:
    name: repo — types, hooks, gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          (cd api && uv sync --locked)
          (cd web && pnpm install --frozen-lockfile)

      # Rule 10: a response schema can't change with stale web types.
      - name: Types are fresh
        run: |
          make types
          if ! git diff --exit-code -- web/src/types/api.ts; then
            echo "::error file=web/src/types/api.ts::Stale types: run 'make types' and commit the result (CLAUDE.md rule 10)."
            exit 1
          fi

      # `git commit --no-verify` skips every hook, and `make lint` doesn't run the
      # colour-token hook at all, so CI runs them all. gitleaks' hook only scans
      # staged changes; the api job scans the whole history instead.
      - name: pre-commit hooks, every file
        env:
          SKIP: gitleaks
        run: uv run --project api pre-commit run --all-files --show-diff-on-failure

      - name: The /done gate's own tests
        run: scripts/ci-gate-test

      - name: The release gate's own tests (D-075)
        run: scripts/release-gate-test
