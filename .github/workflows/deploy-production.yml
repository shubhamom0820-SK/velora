# Production release (T-2.6, D-075). A deliberate act: pushing a tag `v*` on a
# commit of main releases that commit, and nothing else does.
#
#   gate → image (staging's, copied) → migrate (as the owner) → vm (Mumbai VM) → web (Vercel) → smoke
#
# The gate (scripts/release-gate) is the /done gate extended to the live site:
# the commit is on main, CI passed for it, and staging deployed it with its
# smoke check passing, so production only gets what staging proved. It also
# reads the Vercel token's expiry, and warns on this run's page inside 30 days,
# and refuses while either paid plan is missing: Vercel Pro (P-0.15) and
# Supabase Pro for velora-prod (P-0.16).
#
# Secrets and variables live in the `production` GitHub environment, which only
# `v*` tags may deploy to, so no branch's workflow can read them
# (infra/PRODUCTION.md). Third-party actions are pinned to a commit SHA, as in
# deploy.yml. A push event runs the workflow file at the tagged commit.
#
# The API and the worker run on production's Mumbai VM (P-921, D-1020, D-1022),
# from the exact image staging ran: `image` copies it from staging's registry to
# production's by digest, and fails unless the digest is unchanged. The VM's jobs
# sign in to Google Cloud without a key, by Workload Identity Federation, as
# production's deploy account, which may read staging's registry and nothing else
# of staging's (infra/PRODUCTION.md).
name: Deploy production
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

# One release at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # scripts/release-gate reads CI's and staging's runs

env:
  GCP_REGION: asia-south1
  GCP_ZONE: asia-south1-a
  # Where staging's images are; not a secret.
  STAGING_GCP_PROJECT: velora-ic-staging
  PRODUCTION_VM: velora-api-prod
  UV_VERSION: "0.12.13"
  NODE_VERSION: "24"
  VERCEL_CLI_VERSION: "61.1.0"

jobs:
  gate:
    name: gate — on main, CI passed, staging proved it
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # For the Vercel token's expiry: the gate reads it before anything changes.
    environment: production
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Full history, so the gate can see whether the commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Also refuses while the Vercel team is on Hobby (P-0.15) or velora-prod's
      # Supabase organisation is on Free (P-0.16). The Supabase token is scoped:
      # read-only, to velora-prod and its organisation, never a classic token.
      - name: On main, CI passed, staging deployed it; the token and both paid plans
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: scripts/release-gate "$SHA"

  # The image staging deployed for this commit (D-075: production only gets what
  # staging proved), copied into production's registry. Staging pushes a plain
  # Docker manifest; skopeo's --preserve-digests copies its bytes unchanged, where
  # `docker buildx imagetools create` would wrap it in a new index with a new
  # digest (seen 21 October 2026). The digest is read back from production's
  # registry and must equal staging's. Before migrate, so a failed copy changes
  # nothing. Staging keeps its 10 newest images: an older commit's is gone, and
  # this stops, saying to deploy it to staging again first (infra/PRODUCTION.md).
  image:
    name: image — staging's, copied to production's registry
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub's token, exchanged for the deploy account's (WIF)
    outputs:
      image: ${{ steps.copy.outputs.image }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # skopeo is the runner image's own (ubuntu-24.04 lists Skopeo 1.13.3); it
      # reads the registry's credentials from Docker's config, as docker push does.
      - name: Copy staging's image of this commit, its digest unchanged
        id: copy
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          src="$GCP_REGION-docker.pkg.dev/$STAGING_GCP_PROJECT/velora/api"
          dst="$GCP_REGION-docker.pkg.dev/$PROJECT/velora/api"
          skopeo --version || { echo "::error::No skopeo on this runner."; exit 1; }
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          digest="$(gcloud artifacts docker images describe "$src:$SHA" --format='value(image_summary.digest)' || true)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Staging's registry has no image for $SHA: it keeps its 10 newest. Deploy this commit to staging again (Actions → Deploy staging, its full SHA), then tag again."
            exit 1
          fi
          skopeo copy --preserve-digests "docker://$src@$digest" "docker://$dst:$SHA"
          copied="$(gcloud artifacts docker images describe "$dst:$SHA" --format='value(image_summary.digest)')"
          if [[ "$copied" != "$digest" ]]; then
            echo "::error::The copy's digest is '$copied', not staging's $digest: production would run an image staging never ran."
            exit 1
          fi
          echo "image: $dst@$digest (staging's, unchanged)"
          echo "image=$dst@$digest" >> "$GITHUB_OUTPUT"

  migrate:
    name: migrate — as the owner, from CI
    needs: [gate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Supabase's session pooler, IPv4, as staging. The owner's credentials
      # exist only here, never on the VM beside the app (D-046).
      - name: alembic upgrade head
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: scripts/migrate-with-url

  # Production's Mumbai VM, as staging's `vm` job: infra/gce at this commit
  # copied over IAP, then infra/gce/deploy as root (secrets from Secret Manager,
  # the worker's settings checked, the API replaced and healthy or put back). The
  # worker runs only where /etc/velora/worker-on exists (infra/PRODUCTION.md).
  vm:
    name: vm — production's Mumbai VM
    needs: [gate, migrate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to the VM, over IAP
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          IMAGE: ${{ needs.image.outputs.image }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          rel="$RUNNER_TEMP/velora-release-$SHA"
          mkdir -p "$rel"
          git archive "$SHA" infra/gce | tar -x -C "$rel" --strip-components=2
          gcloud compute scp --project="$PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap \
            --recurse --quiet "$rel" "$PRODUCTION_VM:/tmp/"
          gcloud compute ssh "$PRODUCTION_VM" --project="$PROJECT" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --ssh-key-expire-after=30m \
            --command "sudo bash /tmp/velora-release-$SHA/deploy production '$IMAGE' $SHA"

  # After the VM, so the web goes live only once the API it calls is current.
  web:
    name: web — Vercel
    needs: [gate, vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The velora-production project has no Git connection (web/vercel.json),
      # so the web goes live only through here. `next build` refuses an APP_ENV
      # it doesn't know (T-2.6), and the smoke check below catches a valid but
      # wrong one. The CLI reads VERCEL_TOKEN from the environment above, never
      # from --token: arguments show in ps to every process on the machine.
      - name: vercel pull
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production
      - name: vercel build
        env:
          # The web's Sentry release (T-9.12): the commit the gate passed. A
          # build that sends to Sentry refuses to finish without it.
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ needs.gate.outputs.sha }}
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod
      - name: vercel deploy
        # --archive=tgz: a few archive parts per deploy, not one upload per file. The
        # Hobby team's cap is 5,000 uploads a day (api-upload-free), and a deploy is
        # ~761 files, so a day of landings hit it (P-0.15). Same flag in both
        # workflows, so staging proves what production runs (D-075).
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --archive=tgz

  # Caddy must be what answers at api.veloraapp.co.in: a record left on Fly, or
  # anything else, fails here.
  smoke:
    name: smoke — production, from the outside
    needs: [gate, vm, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Production answers, bodies included, built for its own address
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          EXPECT_API_VIA: Caddy
        run: scripts/staging-smoke "$API_URL" "$WEB_URL"
