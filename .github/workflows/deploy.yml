# Staging deploy (T-1.22, D-046). Deploys only a commit whose CI passed — a
# second check after /done's gate (D-044) — and then checks staging itself.
#
#   gate → migrate (as the owner, from here) ─┐
#        ↘ image (Mumbai registry) ───────────┴→ vm (Mumbai VM) → web (Vercel) → smoke, vm-smoke
#
# Staging runs on the Mumbai VM (P-49, D-1020, D-1022): its Caddy serves
# api.staging and api-mumbai.staging, and its worker runs where
# /etc/velora/worker-on exists. Nothing deploys to Fly from here any more (P-920):
# Fly's staging apps stay up, untouched, as the rollback until P-920 destroys
# them, and a deploy of Fly's worker could launch a second worker (D-091). The
# VM's jobs sign in to Google Cloud without a key, by Workload Identity
# Federation: GitHub's token for this repo's `staging` environment, exchanged
# for the deploy account (infra/STAGING.md).
#
# Runs after CI completes on main, for the exact commit CI tested; or by hand
# for any commit whose CI passed (Actions → Deploy staging → Run workflow).
# Secrets and variables live in the `staging` GitHub environment
# (infra/STAGING.md). Third-party actions are pinned to a commit SHA.
# GitHub only triggers workflows that exist on the default branch, so this one
# can't run until it's on main (06-TESTING).
name: Deploy staging
# Named for the exact commit it deploys, which production's release gate matches
# (scripts/release-gate, D-075): a workflow_run's own head SHA is main's newest
# commit when the run started, not always the commit it deploys. A run started
# by hand counts for a release only when given the commit's full SHA.
run-name: Deploy staging ${{ github.event.workflow_run.head_sha || inputs.ref }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy — its CI run must have passed
        required: true
        default: main

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # scripts/ci-gate reads CI runs

env:
  GCP_REGION: asia-south1
  GCP_ZONE: asia-south1-a
  STAGING_VM: velora-api-staging
  UV_VERSION: "0.12.13"
  NODE_VERSION: "24"
  VERCEL_CLI_VERSION: "61.1.0"

jobs:
  gate:
    name: gate — CI passed for this exact commit
    # A completed CI run on main only deploys if it passed, for a push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false

      - name: The commit to deploy
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The same gate as /done: that exact SHA's CI run, failing closed.
      - name: CI passed for it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        # main's own run for it, never another branch's (P-140).
        run: scripts/ci-gate --branch main "$SHA"

  migrate:
    name: migrate — as the owner, from CI
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Supabase's session pooler: IPv4, which GitHub's runners need. The owner's
      # credentials exist only here, never on the VM beside the app (D-046).
      - name: alembic upgrade head
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
        run: scripts/migrate-with-url

  # The image the Mumbai VM runs (P-49): built here, pushed to staging's registry
  # in Mumbai, and named onward by its digest, read back from the registry
  # itself, never by its tag.
  image:
    name: image — staging's registry, Mumbai
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write # GitHub's token, exchanged for the deploy account's (WIF)
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: docker build and push
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          repo="$GCP_REGION-docker.pkg.dev/$PROJECT/velora/api"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          # GIT_SHA: the image's Sentry release (T-9.12), the commit the gate passed.
          docker build --platform linux/amd64 --build-arg "GIT_SHA=$SHA" -t "$repo:$SHA" api
          docker push "$repo:$SHA"

      - name: The image's digest, from the registry
        id: digest
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          repo="$GCP_REGION-docker.pkg.dev/$PROJECT/velora/api"
          digest="$(gcloud artifacts docker images describe "$repo:$SHA" --format='value(image_summary.digest)')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The registry has no digest for $repo:$SHA (read '$digest')."
            exit 1
          fi
          echo "image: $repo@$digest"
          echo "image=$repo@$digest" >> "$GITHUB_OUTPUT"

  # The Mumbai VM (P-49): the release (infra/gce at this commit) copied over IAP,
  # then infra/gce/deploy as root: secrets from Secret Manager, the worker's
  # settings checked, the API replaced and healthy or put back, Caddy for the
  # hosts in staging.edge.env. The VM's worker runs only where
  # /etc/velora/worker-on exists (the swap wrote it), never beside another
  # (D-091). After migrate, so the code never runs ahead of its schema.
  vm:
    name: vm — staging's Mumbai VM
    needs: [gate, migrate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to the VM, over IAP
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          IMAGE: ${{ needs.image.outputs.image }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          rel="$RUNNER_TEMP/velora-release-$SHA"
          mkdir -p "$rel"
          git archive "$SHA" infra/gce | tar -x -C "$rel" --strip-components=2
          gcloud compute scp --project="$PROJECT" --zone="$GCP_ZONE" --tunnel-through-iap \
            --recurse --quiet "$rel" "$STAGING_VM:/tmp/"
          gcloud compute ssh "$STAGING_VM" --project="$PROJECT" --zone="$GCP_ZONE" \
            --tunnel-through-iap --quiet --ssh-key-expire-after=30m \
            --command "sudo bash /tmp/velora-release-$SHA/deploy staging '$IMAGE' $SHA"

  # The VM from the outside, at api-mumbai.staging: Caddy must be what answers,
  # and the staging web, which calls api.staging (the same VM), must be ours.
  vm-smoke:
    name: smoke — the Mumbai VM, from the outside
    needs: [gate, vm, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: The VM answers through Caddy, bodies included
        env:
          VM_API_URL: ${{ vars.STAGING_VM_API_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
          CALLED_API: ${{ vars.STAGING_API_URL }}
          EXPECT_API_VIA: Caddy
        run: scripts/staging-smoke "$VM_API_URL" "$WEB_URL"

  # After the VM, so the web goes live only once the API it calls is current.
  web:
    name: web — Vercel
    needs: [gate, vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The staging project deploys only from here (web/vercel.json turns off its
      # Git deploys), so the web can't go live around the CI gate. --prod puts it on
      # the project's production domain, staging.veloraapp.co.in, which the API's
      # CORS_ORIGINS names (P-33). The CLI reads VERCEL_TOKEN from the job's
      # environment, never from --token: arguments show in ps to every process
      # on the machine (T-2.6; staging proves it before production relies on it).
      - name: vercel pull
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production
      - name: vercel build
        env:
          # The web's Sentry release (T-9.12): the commit the gate passed. A
          # build that sends to Sentry refuses to finish without it.
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ needs.gate.outputs.sha }}
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod
      - name: vercel deploy
        # --archive=tgz: a few archive parts per deploy, not one upload per file. The
        # Hobby team's cap is 5,000 uploads a day (api-upload-free), and a deploy is
        # ~761 files, so a day of landings hit it (P-0.15). Same flag in both
        # workflows, so staging proves what production runs (D-075).
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --archive=tgz

  # api.staging, the host the web calls: Caddy must be what answers, so a record
  # pointed back at Fly fails here instead of passing (P-920).
  smoke:
    name: smoke — staging, from the outside
    needs: [gate, vm, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Staging answers, bodies included
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
          WEB_URL: ${{ vars.STAGING_WEB_URL }}
          EXPECT_API_VIA: Caddy
        run: scripts/staging-smoke "$API_URL" "$WEB_URL"
