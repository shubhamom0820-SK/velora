[project]
name = "velora-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "mypy>=2.3.1",
    "polyfactory>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

# Minimal: enough to run this task's tests. T-1.5 owns the full harness
# (test database, transactional fixtures, factories).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
