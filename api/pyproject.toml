[project]
name = "velora-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0",
    "phonenumberslite>=9.0.40",
    # Exactly, never >= (D-092): it parses hostile images on the worker. Update it
    # when a CVE lands; T-9.13's security review checks this line.
    "pillow==12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5.3.1",
    "sentry-sdk==2.72.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "mypy>=2.3.1",
    "polyfactory>=3.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "websockets>=17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Ruff's curated default rule set — pinned by the ruff version in uv.lock, so it
# only changes on a deliberate upgrade — plus golden rules that a machine should
# enforce rather than a reviewer (D-039).
extend-select = [
    "T20",    # no print() — 07-CHECKLISTS.md §A
    "TID251", # banned APIs below — CLAUDE.md rule 7
]

[tool.ruff.lint.per-file-ignores]
# Blank revisions come with `op` and `sa` imported; the post-write ruff hook
# must not strip them before anyone has written the migration.
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Rule 7: async only — use httpx."
"psycopg2".msg = "Rule 7: async only — use asyncpg through SQLAlchemy."
"time.sleep".msg = "Rule 7: never block the event loop — use asyncio.sleep."
"datetime.datetime.now".msg = "Rule 7: read the time only via app.core.clock.now()."
"datetime.datetime.utcnow".msg = "Rule 7: read the time only via app.core.clock.now()."
"datetime.datetime.today".msg = "Rule 7: read the time only via app.core.clock.now()."
"datetime.date.today".msg = "Rule 7: use app.core.clock.today_ist()."

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic", "seed", "bench", "ops"]
# Ships inside pydantic: types model and Settings constructors properly.
plugins = ["pydantic.mypy"]

# The liveness probe's bench-only tools (D-381) and minivision's network code,
# fetched at run time: none is installed where mypy runs, by design.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "onnxruntime", "MiniFASNet"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: asyncpg connections belong to the loop that
# opened them, and the test engine is shared across the session.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# -ra: always list skips, so "green" never hides tests that did not run.
addopts = "-ra --strict-markers"
markers = [
    "critical: must never be skipped; CI runs these first (06-TESTING.md)",
]
